[package]
name = "buzz-fleet-signer"
version = "0.8.0"
edition = "2021"

[[bin]]
name = "buzz-fleet-signer"
path = "src/main.rs"

[dependencies]
nostr = { version = "0.44", features = ["nip44", "nip98"] }
buzz-ws-client = { git = "https://github.com/block/buzz", rev = "b1f6b7ef770dddbb7f33c9f5861c379a47bca1d6" }
buzz-sdk = { git = "https://github.com/block/buzz", rev = "b1f6b7ef770dddbb7f33c9f5861c379a47bca1d6" }
uuid = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# HTTP transport for `read-presence`: the relay only synthesizes kind:40902/20001
# presence over its HTTP `/query` bridge, never over the plain-websocket REQ path
# (see the doc comment on `fleet::run_query_http`). `rustls-no-provider` reuses the
# `ring` CryptoProvider `main.rs` already installs process-wide for the websocket
# client, instead of pulling in a second (aws-lc-rs) backend via reqwest's default
# `rustls` feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
