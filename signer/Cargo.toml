[package]
name = "buzz-fleet-signer"
version = "0.7.4"
edition = "2021"

[[bin]]
name = "buzz-fleet-signer"
path = "src/main.rs"

[dependencies]
nostr = { version = "0.44", features = ["nip44", "nip98"] }
buzz-ws-client = { git = "https://github.com/block/buzz", rev = "b1f6b7ef770dddbb7f33c9f5861c379a47bca1d6" }
buzz-sdk = { git = "https://github.com/block/buzz", rev = "b1f6b7ef770dddbb7f33c9f5861c379a47bca1d6" }
uuid = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
